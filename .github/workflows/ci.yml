name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + end-to-end tests
        run: pytest -q

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          mne-cli version
          mne-cli commands
          mne-cli dataset demo --out demo_raw.fif
          mne-cli raw load --path demo_raw.fif
          mne-cli raw filter --raw raw_0001 --l-freq 1 --h-freq 40
          mne-cli raw events --raw raw_0002
          mne-cli epochs build --raw raw_0002 --events events_0001 --tmin -0.2 --tmax 0.8
          mne-cli epochs average --epochs epochs_0001 --by event
          mne-cli psd --raw raw_0002
          mne-cli mcp manifest
