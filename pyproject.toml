[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mne-cli"
version = "0.1.0"
description = "An LLM-friendly command line interface for MNE-Python: every analysis step is a single, JSON-speaking command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "cypowerAI" }]
keywords = ["mne", "eeg", "meg", "cli", "llm", "agent", "mcp", "neuroscience"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Environment :: Console",
]
dependencies = [
  "mne>=1.6",
  "numpy>=1.24",
  "h5py>=3.8",
  "h5io>=0.2",
]

[project.optional-dependencies]
decoding = ["scikit-learn>=1.3"]
full = ["scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.scripts]
mne-cli = "mne_cli.cli:main"

[project.urls]
Homepage = "https://github.com/cypowerAI/MNE-CLI"
Source = "https://github.com/cypowerAI/MNE-CLI"
Issues = "https://github.com/cypowerAI/MNE-CLI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mne_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
